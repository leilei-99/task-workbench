<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b82f6">
<title>陈媛工作台</title>
<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
    background: #f4f5f7;
    color: #1f2937;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, textarea { font-family: inherit; font-size: 16px; }
  img { max-width: 100%; height: auto; }

  :root {
    --primary: #3b82f6;
    --primary-dark: #2563eb;
    --primary-light: #dbeafe;
    --success: #10b981;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f4f5f7;
    --card: #ffffff;
    --radius: 12px;
    --tap: 44px;
  }

  /* ===== App Shell ===== */
  .app {
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
  }

  /* ===== Top Bar ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .topbar .brand {
    font-size: 12px; font-weight: 600; letter-spacing: .3px;
    color: var(--primary-dark);
  }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .topbar .sync {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .sync-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
  }

  /* ===== Date Header ===== */
  .date-header { padding: 18px 16px 12px; }
  .date-header .today { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  .date-header .big { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }

  /* ===== Section ===== */
  .section { padding: 0 16px 12px; }
  .section-title {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin: 12px 4px 8px;
    font-weight: 500;
  }

  /* ===== Notice ===== */
  .notice {
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.6;
    margin: 0 0 12px;
  }

  /* ===== Empty / Done State ===== */
  .empty, .done-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 44px 24px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty .empty-illus, .done-card .done-illus {
    width: 64px; height: 64px;
    margin: 0 auto 12px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .empty .empty-illus { background: var(--primary-light); color: var(--primary); }
  .done-card .done-illus { background: #d1fae5; color: var(--success); }
  .empty .title, .done-card .title {
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
    margin: 8px 0 4px;
  }
  .empty .desc, .done-card .desc { font-size: 13px; margin-bottom: 16px; }

  /* ===== Group Card ===== */
  .store-card {
    background: var(--card);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .store-head {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid #f3f4f6;
  }
  .store-head .name { font-size: 17px; font-weight: 600; }
  .day-badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    background: var(--primary-light);
    color: var(--primary-dark);
    white-space: nowrap;
  }
  .day-badge.muted { background: #f3f4f6; color: #6b7280; }
  .day-badge.ok { background: #d1fae5; color: #047857; }
  .store-body { padding: 6px 0; }
  .task-list { list-style: none; margin: 0; padding: 0; }
  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    min-height: var(--tap);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.15s;
  }
  .task-item:active { background: #f9fafb; }
  .task-item.done .text { text-decoration: line-through; color: var(--text-muted); }
  .task-item.readonly { cursor: default; }
  .checkbox {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border: 2px solid #d1d5db;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .task-item.done .checkbox { background: var(--success); border-color: var(--success); }
  .task-item .text { flex: 1; font-size: 15px; word-break: break-all; }
  .task-no-tasks {
    padding: 18px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
  .task-footer {
    padding: 10px 16px 12px;
    border-top: 1px solid #f3f4f6;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
  }
  .progress-bar {
    flex: 1;
    height: 4px;
    background: #f3f4f6;
    border-radius: 2px;
    margin-left: 12px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--success); transition: width 0.3s; }
  .meta-row {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding: 4px 0 12px;
  }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    transition: opacity 0.15s, transform 0.15s;
    min-height: var(--tap);
  }
  .btn:active { opacity: 0.8; transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-ghost { background: #f3f4f6; color: var(--text); }
  .btn-block { width: 100%; }
  .reset-bar { padding: 4px 16px 8px; }

  /* ===== Bottom Tab Bar ===== */
  .tabbar {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 40;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab {
    flex: 1;
    padding: 8px 0 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--text-muted);
    font-size: 11px;
    min-height: 56px;
    justify-content: center;
  }
  .tab.active { color: var(--primary); }
  .tab svg { width: 22px; height: 22px; }

  /* ===== Modal / Sheet ===== */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .sheet {
    background: #fff;
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 720px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 20px 16px 24px;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .sheet .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }
  .form-row { margin-bottom: 14px; }
  .form-row label {
    display: block;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-row textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    background: #fff;
    outline: none;
    transition: border 0.15s, box-shadow 0.15s;
    min-height: 180px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    line-height: 1.6;
    resize: vertical;
  }
  .form-row textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
  .sheet-actions .btn { flex: 1; }

  /* ===== Preview / 规则预览 ===== */
  .preview {
    margin-top: 8px;
    background: #f9fafb;
    border-radius: 10px;
    padding: 12px 14px;
    max-height: 280px;
    overflow-y: auto;
  }
  .preview-day { margin-bottom: 10px; }
  .preview-day:last-child { margin-bottom: 0; }
  .preview-day .label {
    display: inline-block;
    font-size: 12px;
    color: var(--primary-dark);
    background: var(--primary-light);
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .preview-task { font-size: 14px; color: var(--text); padding: 2px 0 2px 4px; }
  .preview-task::before { content: "· "; color: var(--text-muted); }
  .preview-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 16px 0; }
  .parse-errors {
    margin-top: 8px;
    padding: 10px 12px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    color: #991b1b;
    font-size: 13px;
  }
  .parse-errors .err-title { font-weight: 600; margin-bottom: 4px; }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.82);
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 200;
    pointer-events: none;
    animation: toastIn 0.2s ease;
    max-width: 80vw;
    text-align: center;
    white-space: pre-line;
    line-height: 1.5;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%,-40%); } to { opacity: 1; transform: translate(-50%,-50%); } }

  @media (min-width: 720px) {
    .date-header { padding-top: 24px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <span class="brand" id="app-name">陈媛工作台</span>
      <h1 id="page-title">今日任务</h1>
    </div>
    <div class="sync" title="本地存储已启用">
      <span class="sync-dot"></span>
      <span>本地存储</span>
    </div>
  </div>
  <main id="main"></main>
</div>

<nav class="tabbar">
  <button class="tab active" data-page="home">
    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span>今日任务</span>
  </button>
  <button class="tab" data-page="yesterday">
    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
    <span>昨日未完成</span>
  </button>
  <button class="tab" data-page="rules">
    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
    <span>内容设置</span>
  </button>
</nav>

<div class="modal-mask" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* =========================================================
   陈媛工作台
   - 数据层 / 业务逻辑 / UI 分层
   - 单文件、零外部依赖，localStorage 持久化（前缀 wb_taskflow_）
   - 今日任务按类别顺序解锁；昨日未完成按自然日归档，隔天过期
   ========================================================= */

/* ============ 1. 数据层 Storage ============ */
const Storage = (function() {
  const P = 'wb_taskflow_';
  const K_GROUPS = P + 'groups';
  const K_TODAY = P + 'today';
  const K_ARCHIVE = P + 'archive_';

  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw == null) return fallback;
      return JSON.parse(raw);
    } catch (e) {
      console.error('localStorage 读取失败', key, e);
      return fallback;
    }
  }
  function save(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('localStorage 写入失败', key, e);
      return false;
    }
  }

  return {
    getGroups() { return load(K_GROUPS, null); },
    setGroups(g) { return save(K_GROUPS, g); },
    getToday() { return load(K_TODAY, null); },
    setToday(t) { return save(K_TODAY, t); },
    getArchive(date) { return load(K_ARCHIVE + date, null); },
    setArchive(date, a) { return save(K_ARCHIVE + date, a); },
    cleanArchivesExcept(keepDate) {
      try {
        const keepKey = K_ARCHIVE + keepDate;
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(K_ARCHIVE) === 0) keys.push(k);
        }
        keys.forEach(k => { if (k !== keepKey) localStorage.removeItem(k); });
      } catch (e) { /* 忽略清理失败，不影响主流程 */ }
    },
  };
})();

const DEFAULT_GROUPS = [
  { name: 'A类任务', tasks: ['1', '2', '3'] },
  { name: 'B类任务', tasks: ['1', '2', '3'] },
  { name: 'C类任务', tasks: ['1', '2', '3'] },
];

/* ============ 2. 工具层 ============ */
const Utils = {
  parseDate(input) {
    if (input instanceof Date) return new Date(input.getFullYear(), input.getMonth(), input.getDate());
    if (typeof input === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(input)) {
      const [y, m, d] = input.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    return null;
  },
  fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  },
  todayStr() { return Utils.fmtDate(new Date()); },
  yesterdayStr() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return Utils.fmtDate(d);
  },
  fmtDateCN(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const weeks = ['日', '一', '二', '三', '四', '五', '六'];
    return `${y}年${m}月${day}日 周${weeks[d.getDay()]}`;
  },
};

/* ============ 3. 内容解析器 ============
   每行格式：类别名：任务1、任务2、任务3
*/
const RuleParser = {
  parse(text) {
    const result = { parsed: [], errors: [] };
    if (!text || !text.trim()) return result;
    const seenNames = new Set();
    const lines = text.split(/\r?\n/);
    lines.forEach((rawLine, idx) => {
      const lineNo = idx + 1;
      const line = rawLine.trim();
      if (!line) return;
      const m = line.match(/^(.+?)\s*[：:]\s*(.+)$/);
      if (!m) {
        result.errors.push({ lineNo, lineText: line, message: '格式错误，期望「类别名：任务1、任务2」' });
        return;
      }
      const name = m[1].trim();
      const part = m[2].trim();
      if (!name) {
        result.errors.push({ lineNo, lineText: line, message: '类别名不能为空' });
        return;
      }
      if (seenNames.has(name)) {
        result.errors.push({ lineNo, lineText: line, message: `类别名「${name}」重复` });
        return;
      }
      if (/,/.test(part)) {
        result.errors.push({ lineNo, lineText: line, message: '检测到英文逗号「,」，请用中文顿号「、」分隔任务' });
        return;
      }
      const tasks = part.split(/[、]/).map(s => s.trim()).filter(Boolean);
      if (tasks.length === 0) {
        result.errors.push({ lineNo, lineText: line, message: '冒号后面没有任务内容' });
        return;
      }
      const seenTasks = new Set();
      let dup = false;
      tasks.forEach(t => { if (seenTasks.has(t)) dup = true; seenTasks.add(t); });
      if (dup) {
        result.errors.push({ lineNo, lineText: line, message: '同一类别下的任务不能重复' });
        return;
      }
      seenNames.add(name);
      result.parsed.push({ name, tasks });
    });
    return result;
  },
  toText(groups) {
    if (!groups || groups.length === 0) return '';
    return groups.map(g => `${g.name}：${g.tasks.join('、')}`).join('\n');
  },
};

/* ============ 4. 任务与进度 ============ */
const Tasks = {
  key(groupName, taskText) {
    return encodeURIComponent(groupName) + '::' + encodeURIComponent(taskText);
  },
  groupProgress(group, records) {
    let done = 0;
    group.tasks.forEach(t => { if (records[Tasks.key(group.name, t)]) done++; });
    return [done, group.tasks.length];
  },
  currentIndex(groups, records) {
    for (let i = 0; i < groups.length; i++) {
      const [d, t] = Tasks.groupProgress(groups[i], records);
      if (d < t) return i;
    }
    return -1; // 全部完成
  },
  totalCount(groups) {
    return groups.reduce((s, g) => s + g.tasks.length, 0);
  },
  toggle(records, key) {
    const next = { ...records };
    if (next[key]) delete next[key]; else next[key] = true;
    return next;
  },
};

/* ============ 5. UI 渲染层 ============ */
const UI = {
  $main: () => document.getElementById('main'),
  $modal: () => document.getElementById('modal'),
  $sheet: () => document.getElementById('sheet'),
  $title: () => document.getElementById('page-title'),
  $toastTimer: null,

  toast(msg) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    if (UI.$toastTimer) clearTimeout(UI.$toastTimer);
    UI.$toastTimer = setTimeout(() => { el.remove(); }, 1800);
  },

  showSheet(html) {
    UI.$sheet().innerHTML = UI.sanitizeHtml(html);
    UI.$modal().classList.add('show');
  },
  closeSheet() {
    UI.$modal().classList.remove('show');
    UI.$sheet().innerHTML = '';
  },

  iconCheck() { return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg>'; },
  iconBigCheck() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><polyline points="20 6 9 17 4 12"/></svg>'; },
  iconList() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><polyline points="3 6 4 7 6 5"/><polyline points="3 12 4 13 6 11"/><polyline points="3 18 4 19 6 17"/></svg>'; },
  iconClock() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>'; },

  escapeHtml(str) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(str).split('').map(ch => map[ch] || ch).join('');
  },

  /** 构造好的 HTML 写入 DOM 前统一过滤脚本标签、内联事件属性与危险协议 */
  sanitizeHtml(html) {
    return String(html)
      .replace(/<\s*script\b[^>]*>[\s\S]*?<\s*\/\s*script\s*>/gi, '')
      .replace(/\son[a-z]+\s*=\s*\S+/gi, '')
      .replace(/javascript\s*:/gi, '');
  },

  /* ---------- 页签一：今日任务 ---------- */
  renderHome(state) {
    UI.$title().textContent = '今日任务';
    const groups = state.groups;
    const records = state.today.records;

    let html = `
      <div class="date-header">
        <div class="today">今天</div>
        <div class="big">${Utils.fmtDateCN(new Date())}</div>
      </div>
      <div class="section">
        <div class="section-title">今日任务</div>
    `;

    if (groups.length === 0) {
      html += `
        <div class="empty">
          <div class="empty-illus">${UI.iconList()}</div>
          <div class="title">还没有工作内容</div>
          <div class="desc">去「内容设置」页添加类别和任务</div>
          <button class="btn btn-primary" data-action="goto-rules">去内容设置</button>
        </div>
      </div>`;
      UI.$main().innerHTML = UI.sanitizeHtml(html);
      return;
    }

    const idx = Tasks.currentIndex(groups, records);

    if (idx === -1) {
      const total = Tasks.totalCount(groups);
      html += `
        <div class="done-card">
          <div class="done-illus">${UI.iconBigCheck()}</div>
          <div class="title">今日全部完成</div>
          <div class="desc">共 ${total} 项任务。明天打开会自动从「${UI.escapeHtml(groups[0].name)}」重新开始。</div>
          <button class="btn btn-ghost" data-action="reset-today">重置今日</button>
        </div>
      `;
    } else {
      const group = groups[idx];
      const [done, total] = Tasks.groupProgress(group, records);
      const pct = total > 0 ? Math.round(done / total * 100) : 0;
      const items = group.tasks.map(t => {
        const doneFlag = !!records[Tasks.key(group.name, t)];
        return `
          <li class="task-item ${doneFlag ? 'done' : ''}" data-action="toggle-task" data-task-key="${UI.escapeHtml(Tasks.key(group.name, t))}">
            <div class="checkbox">${doneFlag ? UI.iconCheck() : ''}</div>
            <div class="text">${UI.escapeHtml(t)}</div>
          </li>`;
      }).join('');

      html += `
        <div class="store-card">
          <div class="store-head">
            <div class="name">${UI.escapeHtml(group.name)}</div>
            <span class="day-badge">第 ${idx + 1} / ${groups.length} 类</span>
          </div>
          <div class="store-body">
            <ul class="task-list">${items}</ul>
            <div class="task-footer">
              <span>${done} / ${total} 已完成</span>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>
          </div>
        </div>
      `;
      const rest = groups.length - idx - 1;
      if (rest > 0) {
        html += `<div class="meta-row">还有 ${rest} 类待解锁，完成本类后自动显示下一类</div>`;
      }
      html += `
        <div class="reset-bar">
          <button class="btn btn-ghost btn-block" data-action="reset-today">重置今日</button>
        </div>
      `;
    }
    html += `</div>`;
    UI.$main().innerHTML = UI.sanitizeHtml(html);
  },

  /* ---------- 页签二：昨日未完成 ---------- */
  renderYesterday(state) {
    UI.$title().textContent = '昨日未完成';
    const yDate = Utils.parseDate(state.yesterday);
    const yCN = yDate ? Utils.fmtDateCN(yDate) : state.yesterday;
    const archive = state.archive;

    let html = `
      <div class="date-header">
        <div class="today">补做</div>
        <div class="big">${UI.escapeHtml(yCN)}</div>
      </div>
      <div class="section">
        <div class="notice">只保留昨天这一天的未完成项，隔天没打开会自动过期。在这里补做不会影响今日任务的进度。</div>
    `;

    if (!archive || !Array.isArray(archive.groups) || archive.groups.length === 0) {
      html += `
        <div class="empty">
          <div class="empty-illus">${UI.iconClock()}</div>
          <div class="title">昨天没有未完成的记录</div>
          <div class="desc">可能是昨天没有打开工作台，或昨天的任务已全部完成</div>
        </div>
      </div>`;
      UI.$main().innerHTML = UI.sanitizeHtml(html);
      return;
    }

    const rec = archive.records || {};
    let pendingTotal = 0;
    archive.groups.forEach(g => {
      g.tasks.forEach(t => { if (!rec[Tasks.key(g.name, t)]) pendingTotal++; });
    });

    if (pendingTotal === 0) {
      html += `
        <div class="done-card">
          <div class="done-illus">${UI.iconBigCheck()}</div>
          <div class="title">昨天的任务已全部补做</div>
          <div class="desc">当天所有类别的任务都已完成</div>
        </div>
      </div>`;
      UI.$main().innerHTML = UI.sanitizeHtml(html);
      return;
    }

    html += `<div class="section-title" style="margin-top:0">共 ${pendingTotal} 项未完成 · 按类别列出</div>`;

    archive.groups.forEach(g => {
      const pending = g.tasks.filter(t => !rec[Tasks.key(g.name, t)]);
      const [done, total] = Tasks.groupProgress(g, rec);
      let body;
      if (pending.length === 0) {
        body = `<div class="task-no-tasks">该类别已全部完成</div>`;
      } else {
        body = `<ul class="task-list">` + pending.map(t => `
          <li class="task-item" data-action="makeup" data-task-key="${UI.escapeHtml(Tasks.key(g.name, t))}">
            <div class="checkbox"></div>
            <div class="text">${UI.escapeHtml(t)}</div>
          </li>`).join('') + `</ul>`;
      }
      html += `
        <div class="store-card">
          <div class="store-head">
            <div class="name">${UI.escapeHtml(g.name)}</div>
            <span class="day-badge ${pending.length === 0 ? 'ok' : ''}">${pending.length === 0 ? '已完成' : pending.length + ' 项待补做'}</span>
          </div>
          <div class="store-body">${body}</div>
          <div class="task-footer">
            <span>${done} / ${total} 昨天已完成</span>
            <div class="progress-bar"><div class="progress-fill" style="width:${total > 0 ? Math.round(done / total * 100) : 0}%"></div></div>
          </div>
        </div>
      `;
    });

    html += `</div>`;
    UI.$main().innerHTML = UI.sanitizeHtml(html);
  },

  /* ---------- 页签三：内容设置 ---------- */
  renderRules(state) {
    UI.$title().textContent = '内容设置';
    const text = RuleParser.toText(state.groups);

    let html = `
      <div class="section">
        <div class="section-title">每行一个类别，格式：类别名：任务1、任务2</div>
        <div class="form-row" style="margin-top:8px">
          <textarea id="rule-text" placeholder="例如：&#10;A类任务：1、2、3&#10;B类任务：1、2、3">${UI.escapeHtml(text)}</textarea>
        </div>
        <div id="rule-parse-result"></div>
        <button class="btn btn-primary btn-block" data-action="save-rules" style="margin-top:12px">保存内容</button>
      </div>
      <div class="section">
        <div class="section-title">说明</div>
        <ul style="font-size:13px; color:#6b7280; padding-left:20px; line-height:1.8;">
          <li>类别按这里的行顺序依次解锁，做完一类才显示下一类</li>
          <li>支持中文「：」或英文「:」；多个任务用中文顿号「、」分隔，不支持英文逗号</li>
          <li>类别名不能重复，同一类别下的任务也不能重复</li>
          <li>保存后会重置今天的打勾进度，从第一类重新开始</li>
          <li>不会影响「昨日未完成」里已经归档的记录</li>
        </ul>
      </div>
    `;
    UI.$main().innerHTML = UI.sanitizeHtml(html);

    const ta = document.getElementById('rule-text');
    const resultEl = document.getElementById('rule-parse-result');
    function livePreview() { resultEl.innerHTML = UI.sanitizeHtml(UI.renderParsePreview(RuleParser.parse(ta.value))); }
    ta.addEventListener('input', livePreview);
    livePreview();
  },

  renderParsePreview(r) {
    let html = '';
    if (r.errors && r.errors.length > 0) {
      html += `<div class="parse-errors"><div class="err-title">检测到 ${r.errors.length} 处问题：</div>`;
      r.errors.forEach(e => {
        html += `<div>第 ${e.lineNo} 行：${UI.escapeHtml(e.message)}<br><span style="color:#7f1d1d; font-family:monospace; font-size:12px;">「${UI.escapeHtml(e.lineText)}」</span></div>`;
      });
      html += `</div>`;
    } else if (r.parsed.length === 0) {
      html += `<div class="preview"><div class="preview-empty">还没有内容。填写类别后将在此预览。</div></div>`;
    } else {
      html += `<div class="preview">`;
      r.parsed.forEach(g => {
        html += `<div class="preview-day"><div class="label">${UI.escapeHtml(g.name)}</div>`;
        g.tasks.forEach(t => { html += `<div class="preview-task">${UI.escapeHtml(t)}</div>`; });
        html += `</div>`;
      });
      html += `</div>`;
    }
    return html;
  },

  showResetConfirm() {
    UI.showSheet(`
      <h2>重置今日</h2>
      <div class="sub">今天已打勾的任务会全部清空，从第一类重新开始。昨日未完成的记录不受影响。</div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" data-action="close-sheet">取消</button>
        <button class="btn btn-primary" data-action="confirm-reset-today">确认重置</button>
      </div>
    `);
  },
};

/* ============ 6. App — 顶层调度 ============ */
const App = {
  state: null,
  page: 'home',
  _lastDate: null,

  init() {
    // 首次使用写入示例内容
    let g = Storage.getGroups();
    if (!Array.isArray(g) || g.length === 0) {
      g = DEFAULT_GROUPS.map(x => ({ name: x.name, tasks: [...x.tasks] }));
      Storage.setGroups(g);
    }
    this.rollover();

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        this.page = t.dataset.page;
        this.refresh();
      });
    });

    UI.$modal().addEventListener('click', (e) => {
      if (e.target.id === 'modal') UI.closeSheet();
    });
    document.body.addEventListener('click', this.handleClick.bind(this));
    document.body.addEventListener('submit', (e) => e.preventDefault());

    this._lastDate = Utils.todayStr();
    this.refresh();

    // 跨日检测：每分钟检查一次，日期变化则重新归档并刷新
    setInterval(() => {
      const cur = Utils.todayStr();
      if (cur !== this._lastDate) {
        this._lastDate = cur;
        this.rollover();
        this.refresh();
      }
    }, 60000);
  },

  /** 日切：归档昨天、清空今天进度。严格按自然日，只保留昨天一份归档。 */
  rollover() {
    const today = Utils.todayStr();
    const yest = Utils.yesterdayStr();
    const groups = Storage.getGroups() || DEFAULT_GROUPS;
    let t = Storage.getToday();

    if (!t || t.date !== today) {
      if (t && t.date === yest) {
        Storage.setArchive(yest, {
          date: yest,
          groups: Array.isArray(t.groups) ? t.groups : groups,
          records: t.records || {},
        });
      }
      Storage.cleanArchivesExcept(yest);
      Storage.setToday({ date: today, groups: groups, records: {} });
    } else if (!Array.isArray(t.groups)) {
      t.groups = groups;
      Storage.setToday(t);
    }
  },

  refresh() {
    this.state = {
      groups: Storage.getGroups() || DEFAULT_GROUPS,
      today: Storage.getToday() || { date: Utils.todayStr(), groups: [], records: {} },
      yesterday: Utils.yesterdayStr(),
      archive: Storage.getArchive(Utils.yesterdayStr()),
    };
    if (this.page === 'home') UI.renderHome(this.state);
    else if (this.page === 'yesterday') UI.renderYesterday(this.state);
    else UI.renderRules(this.state);
  },

  handleClick(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;

    switch (action) {
      case 'goto-rules': {
        document.querySelectorAll('.tab').forEach(x => {
          x.classList.toggle('active', x.dataset.page === 'rules');
        });
        this.page = 'rules';
        this.refresh();
        break;
      }
      case 'toggle-task': {
        const key = target.dataset.taskKey;
        const groups = this.state.groups;
        const before = Tasks.currentIndex(groups, this.state.today.records);
        const nextRecords = Tasks.toggle(this.state.today.records, key);
        Storage.setToday({ ...this.state.today, records: nextRecords });
        const after = Tasks.currentIndex(groups, nextRecords);
        if (after !== before && before !== -1) {
          if (after === -1) {
            UI.toast('今日全部任务已完成');
          } else if (after > before) {
            UI.toast(`「${groups[before].name}」已完成，开始「${groups[after].name}」`);
          }
        }
        this.refresh();
        break;
      }
      case 'makeup': {
        const key = target.dataset.taskKey;
        const a = this.state.archive;
        if (!a) break;
        const next = { ...a, records: { ...(a.records || {}), [key]: true } };
        Storage.setArchive(a.date, next);
        UI.toast('已补做');
        this.refresh();
        break;
      }
      case 'reset-today':
        UI.showResetConfirm();
        break;
      case 'confirm-reset-today': {
        Storage.setToday({
          date: Utils.todayStr(),
          groups: this.state.groups,
          records: {},
        });
        UI.closeSheet();
        UI.toast('今日进度已重置');
        this.refresh();
        break;
      }
      case 'save-rules': {
        const ta = document.getElementById('rule-text');
        if (!ta) break;
        const result = RuleParser.parse(ta.value);
        if (result.errors.length > 0) {
          UI.toast(`第 ${result.errors[0].lineNo} 行格式错误：${result.errors[0].message}`);
          return;
        }
        if (result.parsed.length === 0) {
          UI.toast('请至少填写一个类别');
          return;
        }
        const ok = Storage.setGroups(result.parsed);
        Storage.setToday({ date: Utils.todayStr(), groups: result.parsed, records: {} });
        UI.closeSheet();
        UI.toast(ok ? '内容已保存，今日进度已重置' : '内容已保存，但本地存储写入失败');
        this.refresh();
        break;
      }
      case 'close-sheet':
        UI.closeSheet();
        break;
      default:
        break;
    }
  },
};

document.addEventListener('DOMContentLoaded', () => { App.init(); });
</script>
</body>
</html>
